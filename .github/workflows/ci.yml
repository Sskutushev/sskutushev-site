name: CI and Delivery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DATABASE_URL: postgresql://root@localhost:26257/portfolio?sslmode=disable
jobs:
  install:
    name: 01 · Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
  prettier:
    name: 02 · Prettier
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check
  eslint:
    name: 03 · ESLint
    needs: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
  typecheck:
    name: 04 · TypeScript
    needs: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
  test:
    name: 05 · Tests
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test
  migrations:
    name: 06 · Prisma & Migrations
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - name: Verify migration files
        shell: bash
        run: test -f prisma/migrations/migration_lock.toml && test -n "$(find prisma/migrations -name migration.sql -print -quit)"
  security:
    name: 07 · Security audit
    needs: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level high
  build:
    name: 08 · Build
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Build applications
        env:
          VITE_GRAPHQL_URL: ${{ vars.PUBLIC_GRAPHQL_URL }}
          VITE_BASE_PATH: /sskutushev-site/
        run: pnpm build
      - name: Start runtime dependencies
        shell: bash
        run: |
          docker run --detach --name portfolio-cockroach \
            --publish 26257:26257 \
            cockroachdb/cockroach:v25.2.3 start-single-node --insecure
          docker run --detach --name portfolio-redis \
            --publish 6379:6379 \
            redis:7.4.5-alpine
          for attempt in {1..30}; do
            if docker exec portfolio-cockroach cockroach sql --insecure \
              --execute 'SELECT 1' > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec portfolio-cockroach cockroach sql --insecure --execute 'SELECT 1'
          docker exec portfolio-redis redis-cli ping
      - name: Runtime boot and GraphQL smoke
        env:
          NODE_ENV: test
          PORT: 4417
          DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: portfolio
          S3_ACCESS_KEY: smoke-access
          S3_SECRET_KEY: smoke-secret
          WEB_ORIGIN: http://localhost:3417
        shell: bash
        run: |
          pnpm --filter @sskutushev/api start > api-smoke.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4417/health/live > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:4417/health/live; then
            cat api-smoke.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:4417/graphql \
            --header 'content-type: application/json' \
            --data '{"query":"query { __typename }"}'
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }
  backend-integration:
    name: 09 · Backend integration
    needs: build
    uses: ./.github/workflows/backend-integration.yml
  frontend-quality:
    name: 10 · Frontend quality
    needs: build
    uses: ./.github/workflows/frontend-quality.yml
  migration-check:
    name: 11 · Migration check
    needs: build
    uses: ./.github/workflows/migration-check.yml
  service-quality:
    name: 12 · Service quality
    needs: build
    uses: ./.github/workflows/services-quality.yml
  performance:
    name: 13 · Performance
    needs: build
    uses: ./.github/workflows/performance.yml
  security-deep:
    name: 14 · Security hardening
    needs: build
    permissions: { contents: read, security-events: write }
    uses: ./.github/workflows/security.yml
  quality-report:
    name: 15 · Quality evidence
    needs:
      [
        backend-integration,
        frontend-quality,
        migration-check,
        service-quality,
        performance,
        security-deep,
      ]
    uses: ./.github/workflows/quality-report.yml
    secrets: inherit
  docker-quality:
    name: 16 · Docker images
    needs: quality-report
    permissions: { contents: read, packages: write }
    uses: ./.github/workflows/docker.yml
    with:
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  publish-pages:
    name: 17 · Publish Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-quality
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  deploy-production:
    name: 18 · Deploy production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: publish-pages
    permissions: { contents: read, packages: read }
    uses: ./.github/workflows/deploy-production.yml
    with:
      image-sha: ${{ github.sha }}
    secrets: inherit
