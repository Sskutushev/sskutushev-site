name: Backend Integration
on: [workflow_call]
permissions: { contents: read }
jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 4417
      DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: portfolio
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      WEB_ORIGIN: http://localhost:4173
      # The k6 job measures application throughput. Rate limiting is covered by
      # dedicated middleware tests and must not turn this into a 429 test.
      RATE_LIMIT_PER_MINUTE: 100000
    steps:
      - uses: actions/checkout@v4
      - name: Start database and cache
        shell: bash
        run: |
          docker run --detach --name cockroach --publish 26257:26257 \
            cockroachdb/cockroach:v25.2.3 start-single-node --insecure
          docker run --detach --name redis --publish 6379:6379 redis:7.4.5-alpine
          for attempt in {1..30}; do
            docker exec cockroach cockroach sql --insecure --execute 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec cockroach cockroach sql --insecure --execute 'SELECT 1'
          docker exec redis redis-cli ping
      - uses: ./.github/actions/setup
      - name: Start S3-compatible storage
        run: >-
          docker run -d --name minio -p 9000:9000
          -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin
          minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
      - name: Wait for storage
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl --fail http://localhost:9000/minio/health/live
      - run: pnpm prisma:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @sskutushev/api build
      - uses: grafana/setup-k6-action@v1
      - name: Boot and verify contracts
        shell: bash
        run: |
          pnpm --filter @sskutushev/api start > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4417/health/ready && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4417/health/ready
          curl --fail http://127.0.0.1:4417/metrics
          curl --fail http://127.0.0.1:4417/graphql \
            -H 'content-type: application/json' \
            --data '{"query":"query { portfolioData(locale: EN) { profile { fullName version } } latestQualityRun { sha } systemEvents(limit: 1) { type } }"}'
          K6_BASE_URL=http://127.0.0.1:4417 k6 run --summary-export=k6-summary.json performance/k6/api.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json
