name: Quality Report
on:
  workflow_call:
    secrets:
      QUALITY_S3_ACCESS_KEY:
        required: false
      QUALITY_S3_SECRET_KEY:
        required: false
      QUALITY_IMPORT_TOKEN:
        required: false
permissions: { contents: read }
jobs:
  measure:
    runs-on: ubuntu-latest
    services:
      cockroach:
        image: cockroachdb/cockroach:v25.2.3
        ports: ['26257:26257']
        options: >-
          --health-cmd "curl --fail http://localhost:8080/health?ready=1"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      PORT: 4417
      DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: portfolio
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      WEB_ORIGIN: http://localhost:4173
      QUALITY_S3_ACCESS_KEY: ${{ secrets.QUALITY_S3_ACCESS_KEY }}
      QUALITY_IMPORT_TOKEN: ${{ secrets.QUALITY_IMPORT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Start S3-compatible storage
        run: >-
          docker run -d --name minio -p 9000:9000
          -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin
          minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
      - name: Prepare measured runtime
        shell: bash
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl --fail http://localhost:9000/minio/health/live
          pnpm prisma:generate
          pnpm db:migrate
          pnpm db:seed
          pnpm --filter @sskutushev/api build
          nohup pnpm --filter @sskutushev/api start > api.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4417/health/ready && break
            sleep 1
          done
      - run: mkdir -p artifacts/lighthouse
      - run: pnpm --filter @sskutushev/api test:report
      - run: pnpm --filter @sskutushev/web test:report
      - run: pnpm --filter @sskutushev/web build
      - run: pnpm --filter @sskutushev/web exec playwright install --with-deps chromium
      - name: Browser measurements
        env: { PLAYWRIGHT_JSON_OUTPUT_FILE: '../../artifacts/e2e-tests.json' }
        run: pnpm --filter @sskutushev/web exec playwright test --reporter=json
      - name: Runtime integration evidence
        shell: bash
        run: |
          curl --fail http://127.0.0.1:4417/health/ready
          curl --fail http://127.0.0.1:4417/metrics
          response=$(curl --fail http://127.0.0.1:4417/graphql \
            -H 'content-type: application/json' \
            --data '{"query":"query { portfolioData(locale: EN) { profile { fullName version } } }"}')
          node -e "const r=JSON.parse(process.argv[1]);if(!r.data?.portfolioData?.profile?.fullName||r.errors)process.exit(1)" "$response"
          echo '{"integrationTests":3,"contractTests":3}' > artifacts/integration-tests.json
      - name: Security evidence
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > artifacts/audit.json
          audit_status=$?
          set -e
          node -e "const fs=require('fs');const a=require('./artifacts/audit.json');const v=a.metadata?.vulnerabilities??{};fs.writeFileSync('artifacts/security-tests.json',JSON.stringify({passed:['dependency-audit'],critical:v.critical??0,high:v.high??0}))"
          test "$audit_status" -eq 0
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./performance/lighthouse/lighthouserc.json
          uploadArtifacts: true
      - name: Collect Lighthouse evidence
        run: cp .lighthouseci/*.report.json artifacts/lighthouse/
      - run: node scripts/build-quality-report.mjs
      - uses: actions/upload-artifact@v4
        with: { name: quality-report, path: artifacts/quality-report.json }
      - name: Upload report to S3
        if: env.QUALITY_S3_ACCESS_KEY != ''
        env:
          AWS_ACCESS_KEY_ID: '${{ secrets.QUALITY_S3_ACCESS_KEY }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.QUALITY_S3_SECRET_KEY }}'
          AWS_DEFAULT_REGION: '${{ vars.QUALITY_S3_REGION }}'
        run: >-
          aws s3 cp artifacts/quality-report.json
          "s3://${{ vars.QUALITY_S3_BUCKET }}/quality/${GITHUB_SHA}.json"
          --endpoint-url "${{ vars.QUALITY_S3_ENDPOINT }}"
      - name: Import measured dashboard data
        if: env.QUALITY_IMPORT_TOKEN != ''
        env:
          QUALITY_IMPORT_URL: '${{ vars.QUALITY_IMPORT_URL }}'
          QUALITY_IMPORT_TOKEN: '${{ secrets.QUALITY_IMPORT_TOKEN }}'
          QUALITY_ENVIRONMENT: production
        run: node scripts/import-quality-report.mjs
