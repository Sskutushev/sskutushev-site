name: Frontend Quality
on: [pull_request]
permissions: { contents: read }
jobs:
  browser-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sskutushev/web lint
      - run: pnpm --filter @sskutushev/web typecheck
      - run: pnpm --filter @sskutushev/web test
      - run: pnpm --filter @sskutushev/web build
      - run: pnpm --filter @sskutushev/web exec playwright install --with-deps chromium
      - run: pnpm --filter @sskutushev/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: apps/web/test-results }
