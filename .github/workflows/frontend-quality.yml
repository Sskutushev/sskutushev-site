name: Frontend Quality
on: [workflow_call]
permissions: { contents: read }
jobs:
  browser-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sskutushev/web lint
      - run: pnpm --filter @sskutushev/web typecheck
      - run: pnpm --filter @sskutushev/web test
      # Reaches GitHub, which is why it is a step rather than a unit test: a
      # suite that needs the network fails for reasons unrelated to the code
      # under it. Here a failure means one thing — an excerpt shown to a
      # reviewer is no longer the code it claims to be.
      - run: pnpm quality:quoted-code
      - run: pnpm --filter @sskutushev/web build
      - run: pnpm --filter @sskutushev/web exec playwright install --with-deps chromium
      - run: pnpm --filter @sskutushev/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: apps/web/test-results }
