name: Deploy Production
on:
  workflow_call:
    inputs:
      image-sha:
        type: string
        required: true
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST_FINGERPRINT:
        required: true
permissions: { contents: read, packages: read }
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage versioned deployment contracts
        uses: appleboy/scp-action@v1.0.0
        with:
          host: '${{ secrets.DEPLOY_HOST }}'
          username: '${{ secrets.DEPLOY_USER }}'
          key: '${{ secrets.DEPLOY_SSH_KEY }}'
          fingerprint: '${{ secrets.DEPLOY_HOST_FINGERPRINT }}'
          source: 'apps/api/scripts/sync-resume.mjs,docker-compose.production.yml,infrastructure/assets/sergey-kutushev-resume.pdf,infrastructure/caddy/Caddyfile,infrastructure/observability,scripts/deploy-production.sh,scripts/rollback-production.sh,scripts/smoke-production.sh'
          target: /opt/sskutushev-site
          overwrite: true
      - name: Deploy immutable image SHA
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_SHA: '${{ inputs.image-sha }}'
          SITE_HOST: '${{ vars.SITE_HOST }}'
        with:
          host: '${{ secrets.DEPLOY_HOST }}'
          username: '${{ secrets.DEPLOY_USER }}'
          key: '${{ secrets.DEPLOY_SSH_KEY }}'
          fingerprint: '${{ secrets.DEPLOY_HOST_FINGERPRINT }}'
          envs: IMAGE_SHA,SITE_HOST
          script_stop: true
          script: |
            cd /opt/sskutushev-site
            export IMAGE_SHA SITE_HOST
            sh scripts/deploy-production.sh
