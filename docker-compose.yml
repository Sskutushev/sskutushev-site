services:
  cockroach:
    image: cockroachdb/cockroach:v24.3.10
    command: start-single-node --insecure
    ports: ['26257:26257', '8080:8080']
    healthcheck:
      {
        test: ['CMD', 'curl', '-f', 'http://localhost:8080/health?ready=1'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    volumes: ['cockroach-data:/cockroach/cockroach-data']
  redis:
    image: redis:7.4-alpine
    ports: ['${REDIS_PORT:-6379}:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ['9000:9000', '9001:9001']
    healthcheck:
      {
        test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    volumes: ['minio-data:/data']
  semantic:
    build: { context: services/semantic, dockerfile: Dockerfile }
    ports: ['8000:8000']
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile, target: build }
    env_file: .env
    environment: { DATABASE_URL: 'postgresql://root@cockroach:26257/defaultdb?sslmode=disable' }
    command: ['pnpm', 'db:migrate']
    restart: 'no'
    depends_on:
      cockroach: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: .env
    environment:
      NODE_ENV: 'production'
      NODE_OPTIONS: '--require @opentelemetry/auto-instrumentations-node/register'
      OTEL_SERVICE_NAME: 'portfolio-api'
      OTEL_TRACES_EXPORTER: 'otlp'
      OTEL_METRICS_EXPORTER: 'none'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
      DATABASE_URL: 'postgresql://root@cockroach:26257/defaultdb?sslmode=disable'
      REDIS_URL: 'redis://redis:6379'
      S3_ENDPOINT: 'http://minio:9000'
      SEMANTIC_URL: 'http://semantic:8000'
    ports: ['4000:4000']
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:4000/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      {
        cockroach: { condition: service_healthy },
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
        minio: { condition: service_healthy },
        semantic: { condition: service_healthy },
      }
  web:
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/web.Dockerfile,
        args: { VITE_GRAPHQL_URL: 'http://localhost:4000/graphql' },
      }
    ports: ['${WEB_PORT:-3000}:80']
    depends_on: [api]
  probe:
    build: { context: services/probe, dockerfile: Dockerfile }
    environment:
      SITE_URL: 'http://web'
      API_URL: 'http://api:4000'
      PROBE_ADDRESS: ':8080'
    ports: ['${PROBE_PORT:-9090}:8080']
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes:
      - ./infrastructure/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports: ['4317:4317', '4318:4318', '9464:9464']
    depends_on:
      api: { condition: service_healthy }
      probe: { condition: service_started }
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ['${PROMETHEUS_PORT:-9091}:9090']
    depends_on: [otel-collector]
  grafana:
    image: grafana/grafana:12.1.1
    environment: { GF_AUTH_ANONYMOUS_ENABLED: 'true', GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer' }
    volumes:
      - ./infrastructure/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./infrastructure/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./infrastructure/observability/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['${GRAFANA_PORT:-3002}:3000']
    depends_on: [prometheus]
volumes: { cockroach-data: {}, minio-data: {} }
