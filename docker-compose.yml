services:
  cockroach:
    image: cockroachdb/cockroach:v24.3.10
    command: start-single-node --insecure
    ports: ['26257:26257', '8080:8080']
    healthcheck:
      {
        test: ['CMD', 'curl', '-f', 'http://localhost:8080/health?ready=1'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    volumes: ['cockroach-data:/cockroach/cockroach-data']
  redis:
    image: redis:7.4-alpine
    ports: ['6379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ['9000:9000', '9001:9001']
    healthcheck:
      {
        test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    volumes: ['minio-data:/data']
  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: .env
    ports: ['4000:4000']
    depends_on:
      {
        cockroach: { condition: service_healthy },
        redis: { condition: service_healthy },
        minio: { condition: service_healthy },
      }
  web:
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/web.Dockerfile,
        args: { VITE_GRAPHQL_URL: 'http://localhost:4000/graphql' },
      }
    ports: ['3000:80']
    depends_on: [api]
volumes: { cockroach-data: {}, minio-data: {} }
