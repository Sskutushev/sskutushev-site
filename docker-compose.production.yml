services:
  semantic:
    image: ghcr.io/sskutushev/sskutushev-site-semantic:${IMAGE_SHA:?IMAGE_SHA is required}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
  api:
    image: ghcr.io/sskutushev/sskutushev-site-api:${IMAGE_SHA:?IMAGE_SHA is required}
    env_file: .env.production
    environment:
      SEMANTIC_URL: 'http://semantic:8000'
      NODE_OPTIONS: '--require @opentelemetry/auto-instrumentations-node/register'
      OTEL_SERVICE_NAME: 'portfolio-api'
      OTEL_TRACES_EXPORTER: 'otlp'
      OTEL_METRICS_EXPORTER: 'none'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:4000/health/live']
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      semantic: { condition: service_healthy }
  web:
    image: ghcr.io/sskutushev/sskutushev-site-web:${IMAGE_SHA:?IMAGE_SHA is required}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 10
  probe:
    image: ghcr.io/sskutushev/sskutushev-site-probe:${IMAGE_SHA:?IMAGE_SHA is required}
    environment:
      SITE_URL: 'http://web'
      API_URL: 'http://api:4000'
      PROBE_ADDRESS: ':8080'
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes:
      - ./infrastructure/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      api: { condition: service_healthy }
      probe: { condition: service_started }
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [otel-collector]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    environment: { GF_AUTH_ANONYMOUS_ENABLED: 'false' }
    volumes:
      - ./infrastructure/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./infrastructure/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./infrastructure/observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    environment: { SITE_HOST: '${SITE_HOST:?SITE_HOST is required}' }
    ports: ['80:80', '443:443']
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    restart: unless-stopped
volumes: { caddy-data: {}, prometheus-data: {}, grafana-data: {} }
